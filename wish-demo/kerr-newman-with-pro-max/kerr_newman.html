<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerr–Newman 黑洞 · WebGL 实时光子哈密顿量渲染</title>
<style>
  :root {
    --bg: #05070d;
    --panel-bg: rgba(12, 17, 28, 0.78);
    --panel-border: rgba(140, 180, 255, 0.14);
    --text: #dce6f5;
    --text-dim: #8fa0bd;
    --accent: #6fb4ff;
    --accent-warm: #ffc46f;
    --danger: #ff7a7a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Inter", "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
  }
  #glcanvas {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    cursor: crosshair;
  }
  #panel {
    position: fixed;
    top: 14px; right: 14px; bottom: 14px;
    width: 322px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 18px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
  }
  #panel-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(120,170,255,0.06), transparent);
  }
  #panel-header h1 {
    font-size: 17px;
    font-weight: 650;
    letter-spacing: 0.4px;
    background: linear-gradient(90deg, #cfe4ff, #9fc6ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #panel-header p {
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  #panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 6px 14px 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(120,160,220,0.25) transparent;
  }
  #panel-body::-webkit-scrollbar { width: 5px; }
  #panel-body::-webkit-scrollbar-thumb { background: rgba(120,160,220,0.25); border-radius: 3px; }

  .section { margin-top: 12px; }
  .section-title {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.85;
    margin-bottom: 7px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(120,170,255,0.12);
  }
  .row {
    display: grid;
    grid-template-columns: 92px 1fr 46px;
    align-items: center;
    gap: 8px;
    margin: 5px 0;
  }
  .row label {
    font-size: 11.5px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .row input[type="range"] {
    width: 100%;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .row .val {
    font-size: 10.5px;
    color: var(--text);
    text-align: right;
    font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    padding: 2px 4px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 7px 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  .checkbox-row input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .btn-row {
    display: flex;
    gap: 8px;
    margin: 12px 0 6px;
  }
  .btn {
    flex: 1;
    padding: 8px 10px;
    font-size: 12px;
    letter-spacing: 0.6px;
    border-radius: 9px;
    border: 1px solid var(--panel-border);
    background: rgba(120,170,255,0.08);
    color: var(--text);
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .btn:hover { background: rgba(120,170,255,0.18); border-color: rgba(120,170,255,0.35); }
  .btn.warm { border-color: rgba(255,196,111,0.25); background: rgba(255,196,111,0.06); }
  .btn.warm:hover { background: rgba(255,196,111,0.16); }
  #info-bar {
    margin-top: 8px;
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.7;
    border-top: 1px solid rgba(120,170,255,0.1);
    padding-top: 8px;
  }
  #info-bar b { color: var(--text); font-weight: 600; }
  #fallback-warning {
    position: fixed; left: 16px; bottom: 16px;
    background: rgba(60, 20, 20, 0.8);
    border: 1px solid rgba(255, 120, 120, 0.4);
    color: #ffd0d0;
    padding: 8px 12px;
    font-size: 12px;
    border-radius: 8px;
    display: none;
    z-index: 20;
  }
  @media (max-width: 760px) {
    #panel { width: 270px; top: 8px; right: 8px; bottom: 8px; }
    .row { grid-template-columns: 74px 1fr 40px; gap: 5px; }
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="panel">
  <div id="panel-header">
    <h1>Kerr–Newman 黑洞</h1>
    <p>ingoing/outgoing Kerr-Schild · 光子哈密顿量 · RK4 · 3D 体积吸积盘</p>
  </div>
  <div id="panel-body"></div>
</div>
<div id="fallback-warning">当前浏览器不支持 float 渲染目标，已降级为 LDR（bloom/色散质量下降）。</div>

<script>
"use strict";

/* ============================================================
 * 参数
 * ============================================================ */
const DEFAULTS = {
  spin: 0.9,            // 物理自旋 a/M（user spin）
  charge: 0.0,          // 电荷 Q/M
  camDist: 13.0,
  camElev: 12.0,        // 度
  camAzim: 0.0,         // 度
  fov: 72.0,            // 度
  diskInner: 3.2,
  diskOuter: 7.5,
  diskBright: 4.0,
  diskDensity: 1.7,
  diskTemp: 9200.0,
  diskHeight: 0.55,
  turbStr: 0.65,
  turbScale: 3.4,
  turbSpeed: 1.0,
  extStr: 0.35,
  exposure: 1.35,
  bloom: 0.8,
  ca: 0.0045,
  vignette: 0.35,
  skyBright: 1.15,
  stepScale: 1.0,
  maxSteps: 2400,
  renderScale: 0.6,
  autoOrbit: true,
  pause: false,
};
const params = { ...DEFAULTS };

/* ============================================================
 * WebGL 初始化
 * ============================================================ */
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  powerPreference: 'high-performance'
});

if (!gl) {
  document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd0d0;font-size:16px;">需要支持 WebGL2 的浏览器。</div>';
  throw new Error('WebGL2 unavailable');
}

const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
const RT_INTERNAL = hasFloat ? gl.RGBA16F : gl.RGBA8;
const RT_TYPE = hasFloat ? gl.FLOAT : gl.UNSIGNED_BYTE;
if (!hasFloat) {
  document.getElementById('fallback-warning').style.display = 'block';
}

function compileShader(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(sh));
    throw new Error(gl.getShaderInfoLog(sh));
  }
  return sh;
}

function createProgram(vsSrc, fsSrc) {
  const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
  const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(prog));
    throw new Error(gl.getProgramInfoLog(prog));
  }
  return prog;
}

const VS_SRC = `#version 300 es
layout(location=0) in vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;

/* 全屏三角形 */
const quadVAO = (() => {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return vao;
})();

/* ============================================================
 * 天空盒（等距柱状投影，Canvas 2D 生成）
 * ============================================================ */
function generateSkyCanvas() {
  const W = 2048, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');

  const bg = x.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0.00, '#030309');
  bg.addColorStop(0.30, '#070912');
  bg.addColorStop(0.50, '#0b0d18');
  bg.addColorStop(0.72, '#060810');
  bg.addColorStop(1.00, '#020207');
  x.fillStyle = bg;
  x.fillRect(0, 0, W, H);

  x.globalCompositeOperation = 'lighter';

  // 银河盘带：沿 u 轴的正弦软光带
  const bandY = (u) => H * (0.5 + 0.13 * Math.sin(u * Math.PI * 2.0 + 1.25) + 0.05 * Math.sin(u * Math.PI * 5.4 + 0.6));
  for (let i = 0; i < 1400; i++) {
    const u = i / 1400;
    const px = u * W;
    const py = bandY(u) + (Math.random() - 0.5) * H * 0.018;
    const r = 18 + Math.random() * 95;
    const grad = x.createRadialGradient(px, py, 0, px, py, r);
    const a = 0.006 + Math.random() * 0.02;
    const tint = Math.random() < 0.55 ? '205,214,255' : '255,234,205';
    grad.addColorStop(0, `rgba(${tint},${a})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }

  // 星云斑
  const nebulas = [
    { u: 0.18, v: 0.38, r: 0.14, c: '70,100,190', a: 0.055 },
    { u: 0.62, v: 0.56, r: 0.10, c: '180,110,80', a: 0.045 },
    { u: 0.80, v: 0.30, r: 0.12, c: '60,140,150', a: 0.05 },
    { u: 0.42, v: 0.68, r: 0.09, c: '150,90,170', a: 0.04 },
    { u: 0.28, v: 0.22, r: 0.08, c: '190,160,90', a: 0.035 },
  ];
  for (const nb of nebulas) {
    const px = nb.u * W, py = nb.v * H;
    const r = nb.r * W;
    const grad = x.createRadialGradient(px, py, 0, px, py, r);
    grad.addColorStop(0, `rgba(${nb.c},${nb.a})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }

  // 恒星
  for (let i = 0; i < 5600; i++) {
    const u = Math.random();
    let v = Math.random();
    if (Math.random() < 0.62) v = 0.5 + (Math.random() - 0.5) * 0.22; // 银盘聚集
    const px = u * W, py = v * H;
    const s = Math.random() < 0.93 ? 1 : 2;
    const b = Math.random();
    const t = Math.random();
    const col = t < 0.55 ? '255,255,255' : (t < 0.82 ? '205,218,255' : '255,222,190');
    const alpha = 0.08 + b * b * 0.85;
    x.fillStyle = `rgba(${col},${alpha})`;
    x.fillRect(px, py, s, s);
  }

  // 亮星 + 星芒
  for (let i = 0; i < 46; i++) {
    const u = Math.random();
    const v = 0.5 + (Math.random() - 0.5) * 0.35;
    const px = u * W, py = v * H;
    const r = 1.5 + Math.random() * 3.5;
    const grad = x.createRadialGradient(px, py, 0, px, py, r * 3.2);
    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
    grad.addColorStop(0.25, 'rgba(205,222,255,0.28)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad;
    x.fillRect(px - r * 3.2, py - r * 3.2, r * 6.4, r * 6.4);
    x.strokeStyle = 'rgba(255,255,255,0.22)';
    x.lineWidth = 0.8;
    const L = r * 4.2;
    x.beginPath();
    x.moveTo(px - L, py); x.lineTo(px + L, py);
    x.moveTo(px, py - L); x.lineTo(px, py + L);
    x.stroke();
  }

  return c;
}

function createSkyTexture() {
  const sky = generateSkyCanvas();
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, sky);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
const skyTexture = createSkyTexture();

/* ============================================================
 * 渲染目标
 * ============================================================ */
function createRT(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, RT_INTERNAL, w, h, 0, gl.RGBA, RT_TYPE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (status !== gl.FRAMEBUFFER_COMPLETE) console.warn('FBO incomplete:', status);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}

let hdrRT, brightRT, blurA, blurB;
let hdrW = 2, hdrH = 2;

function deleteRT(rt) {
  if (!rt) return;
  gl.deleteFramebuffer(rt.fbo);
  gl.deleteTexture(rt.tex);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
  const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  const scale = params.renderScale;
  hdrW = Math.max(2, Math.floor(w * scale));
  hdrH = Math.max(2, Math.floor(h * scale));
  const bw = Math.max(2, Math.floor(hdrW / 2));
  const bh = Math.max(2, Math.floor(hdrH / 2));

  deleteRT(hdrRT); deleteRT(brightRT); deleteRT(blurA); deleteRT(blurB);
  hdrRT = createRT(hdrW, hdrH);
  brightRT = createRT(bw, bh);
  blurA = createRT(bw, bh);
  blurB = createRT(bw, bh);
}

/* ============================================================
 * 着色器
 * ============================================================ */
const SCENE_FS = `#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;

uniform vec2 uResolution;
uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uCamF;
uniform vec3 uCamR;
uniform vec3 uCamU;
uniform vec3 uCamB0;
uniform vec3 uCamB1;
uniform vec3 uCamB2;
uniform vec3 uCamK;
uniform float uCamFval;
uniform float uCamSqrt;
uniform float uA;        // outgoing 度规自旋 = -uSpin
uniform float uQ;
uniform float uSpin;     // 物理自旋，用于盘转速
uniform float uDiskInner;
uniform float uDiskOuter;
uniform float uDiskBright;
uniform float uDiskDensity;
uniform float uDiskTemp;
uniform float uDiskHeight;
uniform float uTurbStr;
uniform float uTurbScale;
uniform float uTurbSpeed;
uniform float uExtStr;
uniform float uSkyBright;
uniform float uStepScale;
uniform float uFovTan;
uniform int uMaxSteps;
uniform sampler2D uSkyTex;

const float PI = 3.141592653589793;
const float HORIZON_PT = 1.0e9;
const float R_MAX = 160.0;
const float SING_EPS = 1.0e-4;
const float SING_R = 0.02;
const vec3 SING_COLOR = vec3(5.0, 3.0, 6.5);

/* ---------- 3D 噪声 ---------- */
float hash13(vec3 p) {
  p = fract(p * 0.3183099 + vec3(0.11, 0.17, 0.13));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float vnoise(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash13(i);
  float n100 = hash13(i + vec3(1,0,0));
  float n010 = hash13(i + vec3(0,1,0));
  float n110 = hash13(i + vec3(1,1,0));
  float n001 = hash13(i + vec3(0,0,1));
  float n101 = hash13(i + vec3(1,0,1));
  float n011 = hash13(i + vec3(0,1,1));
  float n111 = hash13(i + vec3(1,1,1));
  return mix(
    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),
    f.z);
}
float fbm(vec3 p) {
  float s = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    s += a * vnoise(p);
    p = p * 2.03 + vec3(11.7, 7.3, 5.1) * float(i);
    a *= 0.5;
  }
  return s;
}
vec2 rot2(vec2 p, float ang) {
  float c = cos(ang), s = sin(ang);
  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);
}

/* ---------- 黑体色（Tanner Helland 拟合） ---------- */
vec3 blackbody(float T) {
  float t = clamp(T, 1000.0, 40000.0) / 100.0;
  vec3 c;
  if (t <= 66.0) {
    c.r = 255.0;
    c.g = clamp(99.4708025861 * log(t) - 161.1195681661, 0.0, 255.0);
  } else {
    c.r = clamp(329.698727446 * pow(t - 60.0, -0.1332047592), 0.0, 255.0);
    c.g = clamp(288.1221695283 * pow(t - 60.0, -0.0755148492), 0.0, 255.0);
  }
  if (t >= 66.0) c.b = 255.0;
  else if (t <= 19.0) c.b = 0.0;
  else c.b = clamp(138.5177312231 * log(t - 10.0) - 305.0447927307, 0.0, 255.0);
  return c / 255.0;
}

/* ---------- Kerr-Schild 几何（outgoing: l_mu = (-1, k)） ---------- */
struct BasicGeom {
  float r;      // 有符号 r（antiverse 为负）
  float rpos;   // 正的 oblate r
  float sigma;
  float f;
  vec3 k;
};
struct Geom {
  float r;
  float rpos;
  float sigma;
  float f;
  vec3 k;
  vec3 gradF;
  mat3 jacK;    // 列为 grad(kx), grad(ky), grad(kz)
};

float oblateR(vec3 x, float a) {
  float R2 = dot(x, x);
  float a2 = a * a;
  float b = R2 - a2;
  float u = 0.5 * (b + sqrt(max(b * b + 4.0 * a2 * x.z * x.z, 0.0)));
  return sqrt(max(u, 0.0));
}

BasicGeom basicGeom(vec3 x, float a, float Q, float rsign) {
  BasicGeom g;
  g.rpos = oblateR(x, a);
  g.r = rsign * g.rpos;
  float r = g.r;
  float r2 = r * r;
  float a2 = a * a;
  float z2 = x.z * x.z;
  float D = max(r2 + a2, 1e-10);
  float rSafe = max(abs(r), 1e-8);
  float r2Safe = max(r2, 1e-12);
  g.k = vec3((r * x.x + a * x.y) / D, (r * x.y - a * x.x) / D, x.z / rSafe);
  g.sigma = r2 + a2 * z2 / r2Safe;
  float sig = max(g.sigma, 1e-10);
  g.f = (2.0 * r - Q * Q) / sig;
  return g;
}

Geom computeGeom(vec3 x, float a, float Q, float rsign) {
  BasicGeom b = basicGeom(x, a, Q, rsign);
  Geom g;
  g.r = b.r; g.rpos = b.rpos; g.sigma = b.sigma; g.f = b.f; g.k = b.k;

  float r = g.r;
  float r2 = r * r;
  float a2 = a * a;
  float z = x.z;
  float z2 = z * z;
  float D = max(r2 + a2, 1e-10);
  float rSafe = max(abs(r), 1e-8);
  float r2Safe = max(r2, 1e-12);
  float sig = max(g.sigma, 1e-10);

  vec3 gradR;
  gradR.x = r * x.x / sig;
  gradR.y = r * x.y / sig;
  gradR.z = z * (r2 + a2) / (rSafe * sig);

  vec3 gradSigma;
  float r3 = max(r2 * rSafe, 1e-12);
  gradSigma.x = 2.0 * r * gradR.x - 2.0 * a2 * z2 * gradR.x / r3;
  gradSigma.y = 2.0 * r * gradR.y - 2.0 * a2 * z2 * gradR.y / r3;
  gradSigma.z = 2.0 * r * gradR.z - 2.0 * a2 * z2 * gradR.z / r3 + 2.0 * a2 * z / r2Safe;

  g.gradF = (2.0 * gradR * sig - (2.0 * r - Q * Q) * gradSigma) / (sig * sig);

  vec3 ex = vec3(1, 0, 0);
  vec3 ey = vec3(0, 1, 0);
  vec3 ez = vec3(0, 0, 1);
  float A = r * x.x + a * x.y;
  float B = r * x.y - a * x.x;
  vec3 dkx = (gradR * x.x + r * ex + a * ey - (2.0 * r * A / D) * gradR) / D;
  vec3 dky = (gradR * x.y + r * ey - a * ex - (2.0 * r * B / D) * gradR) / D;
  vec3 dkz = (ez * r - z * gradR) / r2Safe;
  g.jacK = mat3(dkx, dky, dkz);
  return g;
}

/* ---------- 哈密顿方程 ---------- */
vec3 dxdlam(vec4 p, Geom g) {
  float kp = dot(g.k, p.yzw);
  return p.yzw - g.f * g.k * (p.x + kp);
}
float pTcontra(vec4 p, BasicGeom g) {
  float kp = dot(g.k, p.yzw);
  return -(1.0 + g.f) * p.x - g.f * kp;
}
vec4 dpdlam(vec4 p, Geom g) {
  float kp = dot(g.k, p.yzw);
  float cmn = p.x + kp;
  vec3 Jp = g.jacK * p.yzw;
  vec3 force = 0.5 * g.gradF * cmn * cmn + g.f * cmn * Jp;
  return vec4(0.0, force);
}

/* ---------- 零质量约束修正（保持 H=0，避免光子获得质量） ---------- */
void enforceNull(inout vec4 p, Geom g) {
  float pt = p.x;
  vec3 ps = p.yzw;
  float kp = dot(g.k, ps);
  float A = dot(ps, ps) - g.f * kp * kp;
  float B = -2.0 * g.f * pt * kp;
  float C = -(1.0 + g.f) * pt * pt;
  float disc = B * B - 4.0 * A * C;
  if (A > 1e-12 && disc >= 0.0) {
    float sq = sqrt(disc);
    float c1 = (-B + sq) / (2.0 * A);
    float c2 = (-B - sq) / (2.0 * A);
    float c = abs(c1 - 1.0) < abs(c2 - 1.0) ? c1 : c2;
    p.yzw *= clamp(c, 0.5, 1.5);
  }
}

/* ---------- RK4 ---------- */
void rk4Step(inout vec3 x, inout vec4 p, float h, float a, float Q, float rsign) {
  Geom g0 = computeGeom(x, a, Q, rsign);
  vec3 k1x = dxdlam(p, g0);
  vec4 k1p = dpdlam(p, g0);

  Geom g1 = computeGeom(x + 0.5 * h * k1x, a, Q, rsign);
  vec3 k2x = dxdlam(p + 0.5 * h * k1p, g1);
  vec4 k2p = dpdlam(p + 0.5 * h * k1p, g1);

  Geom g2 = computeGeom(x + 0.5 * h * k2x, a, Q, rsign);
  vec3 k3x = dxdlam(p + 0.5 * h * k2p, g2);
  vec4 k3p = dpdlam(p + 0.5 * h * k2p, g2);

  Geom g3 = computeGeom(x + h * k3x, a, Q, rsign);
  vec3 k4x = dxdlam(p + h * k3p, g3);
  vec4 k4p = dpdlam(p + h * k3p, g3);

  x += h / 6.0 * (k1x + 2.0 * k2x + 2.0 * k3x + k4x);
  p += h / 6.0 * (k1p + 2.0 * k2p + 2.0 * k3p + k4p);

  Geom gg = computeGeom(x, a, Q, rsign);
  enforceNull(p, gg);
}

/* ---------- 自适应步长（自然仿射参数，不除以空间速度） ---------- */
float stepSize(BasicGeom g, vec3 x) {
  float h = uStepScale * clamp(0.035 * max(g.rpos, 0.02), 0.0004, 1.5);
  float safety = clamp(g.sigma / (g.rpos * g.rpos + uA * uA + uQ * uQ + 0.05), 0.05, 1.0);
  h *= safety;
  float Rc = length(x.xy);
  float e0 = min(uDiskInner * 0.4, uDiskOuter * 1.6);
  float e1 = max(uDiskInner * 0.4, uDiskOuter * 1.6);
  float radialMask = smoothstep(e0, e1 + 1e-4, Rc);
  float vertMask = exp(-abs(x.z) / (uDiskHeight * 2.5 + 0.01));
  float diskMask = 1.0 - radialMask * vertMask;
  h *= mix(1.0, 0.3, clamp(diskMask, 0.0, 1.0));
  return clamp(h, 0.0004, 1.5);
}

/* ---------- 3D 体积吸积盘 ---------- */
void sampleDisk(vec3 xs, float ds, vec4 p, float rsign, inout vec3 T, inout vec3 acc) {
  if (rsign < 0.0) return;  // antiverse：不渲染吸积盘，只保留反向星空
  float Rc = length(xs.xy);
  float zz = abs(xs.z);

  float innerFade = smoothstep(uDiskInner * 0.55, uDiskInner, Rc);
  float radial = exp(-Rc / max(uDiskOuter, 0.5)) * innerFade;
  float vert = exp(-zz / max(uDiskHeight, 0.05));
  float dens0 = uDiskDensity * radial * vert;
  if (dens0 < 1e-5) return;

  // 湍流噪声：随盘差速旋转的 3D fbm
  float omPat = 1.0 / (pow(max(Rc, 2.2), 1.5) + uSpin);
  float ang = -omPat * uTime * uTurbSpeed;
  vec2 rq = rot2(xs.xy, ang);
  vec3 q = vec3(rq * uTurbScale, xs.z * uTurbScale * 1.6);
  float n = fbm(q);
  float dens = dens0 * (1.0 + uTurbStr * (n * 2.0 - 1.0));
  dens = max(dens, 0.0);
  if (dens < 1e-5) return;

  float bright = uDiskBright * exp(-Rc / max(uDiskOuter * 0.65, 0.5)) * innerFade;
  float temp = max(uDiskTemp * exp(-Rc / max(uDiskOuter * 0.8, 0.5)), 1200.0);

  // 盘 4-速度：物理顺行盘 -> outgoing 时间反演下的逆轨道
  float rD = max(oblateR(xs, uA), 2.2);
  float Om = -1.0 / (pow(rD, 1.5) + uSpin);

  BasicGeom gd = basicGeom(xs, uA, uQ, rsign);
  float kdotphi = xs.x * gd.k.y - xs.y * gd.k.x;
  float gtphi = gd.f * (xs.y * gd.k.x - xs.x * gd.k.y);
  float gtt = gd.f - 1.0;
  float gpp = Rc * Rc + gd.f * kdotphi * kdotphi;
  float G = gtt + 2.0 * Om * gtphi + Om * Om * gpp;
  float uT = inversesqrt(max(-G, 1e-8));
  float pphi = xs.x * p.y - xs.y * p.x;
  float Eemit = -uT * (p.x + Om * pphi);
  if (Eemit <= 1e-5) return;

  float gdopp = clamp(1.0 / Eemit, 0.03, 30.0);
  float dopp4 = gdopp * gdopp * gdopp * gdopp;

  vec3 col = blackbody(temp * gdopp) * (bright * dopp4);
  vec3 emission = col * (dens * ds);

  // 体积消光：蓝光权重更高 -> 红化
  vec3 kappa = dens * uExtStr * vec3(0.35, 0.65, 1.15);
  vec3 att = exp(-kappa * ds);

  acc += T * emission;
  T *= att;
}

vec2 skyUV(vec3 d) {
  float u = atan(d.x, d.z) / (2.0 * PI) + 0.5;
  float v = asin(clamp(d.y, -1.0, 1.0)) / PI + 0.5;
  return vec2(u, v);
}

/* ---------- 主行进 ---------- */
vec3 march(vec2 fragCoord) {
  vec2 uv = fragCoord / uResolution;
  float aspect = uResolution.x / uResolution.y;
  vec2 ndc = uv * 2.0 - 1.0;
  float sx = ndc.x * uFovTan * aspect;
  float sy = ndc.y * uFovTan;

  // 静态观者局部方向 -> 坐标空间动量（B 为空间度规的平方根映射）
  vec3 d = normalize(uCamF + sx * uCamR + sy * uCamU);
  mat3 B = mat3(uCamB0, uCamB1, uCamB2);
  vec3 n = B * d;

  float pt = -uCamSqrt;
  float alpha = 1.0 / uCamSqrt;
  float kn = dot(uCamK, n);
  float nt = -uCamFval * kn / (1.0 - uCamFval);
  float pT0 = alpha + nt;
  vec3 psp = n + uCamFval * uCamK * (-pT0 + kn);
  vec4 p = vec4(pt, psp);

  vec3 x = uCamPos;
  vec3 acc = vec3(0.0);
  vec3 T = vec3(1.0);
  float rsign = 1.0;
  float prevZ = x.z;
  int lastFlip = -10;
  bool escaped = false;

  float rPlus = 1.0 + sqrt(max(1.0 - uA * uA - uQ * uQ, 0.0));
  bool hasHorizon = (uA * uA + uQ * uQ) <= 1.0;

  for (int i = 0; i < 4000; i++) {
    if (i >= uMaxSteps) break;

    BasicGeom bg = basicGeom(x, uA, uQ, rsign);
    float pT = pTcontra(p, bg);

    // 视界：p^t 过大，或（仅当视界存在时）越过 outgoing 坐标边界使 p^t<0
    if (pT > HORIZON_PT || (hasHorizon && pT < 0.0)) return acc;

    // 视界几何安全网：防止黑洞视界内的射线误入奇点
    if (hasHorizon && bg.rpos < rPlus) return acc;

    // 裸奇环/裸奇点
    if (bg.sigma < SING_EPS || (abs(uA) < 0.001 && bg.rpos < SING_R)) {
      return acc + T * SING_COLOR;
    }

    float h = stepSize(bg, x);
    vec3 xPrev = x;
    rk4Step(x, p, h, uA, uQ, rsign);

    // 穿越 r=0 盘面（环内）到 antiverse：翻转 r 的符号
    float rposNew = oblateR(x, uA);
    float rho2 = x.x * x.x + x.y * x.y;
    if (prevZ * x.z < 0.0 && rho2 < uA * uA && min(bg.rpos, rposNew) < 0.8 && i - lastFlip > 3) {
      rsign = -rsign;
      lastFlip = i;
    }
    prevZ = x.z;

    // 体积采样：随机抖动打破层纹
    float jitter = hash13(vec3(fragCoord, float(i) + 0.7));
    vec3 xs = mix(xPrev, x, jitter);
    float ds = length(x - xPrev);
    if (ds > 0.0) sampleDisk(xs, ds, p, rsign, T, acc);

    if (rposNew > R_MAX) { escaped = true; break; }
  }

  if (escaped) {
    vec3 dir = normalize(p.yzw + 1e-8);
    vec3 sky = texture(uSkyTex, skyUV(dir)).rgb * uSkyBright;
    if (rsign < 0.0) sky = vec3(1.0) - sky;  // antiverse 天空取相反色
    return acc + T * sky;
  }
  return acc;
}

void main() {
  vec3 col = march(gl_FragCoord.xy);
  col = clamp(col, 0.0, 80.0);
  fragColor = vec4(col, 1.0);
}
`;

const BRIGHT_FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform sampler2D uTex;
uniform float uThresh;
void main() {
  vec2 uv = gl_FragCoord.xy / vec2(textureSize(uTex, 0));
  vec3 c = texture(uTex, uv).rgb;
  float l = max(c.r, max(c.g, c.b));
  float k = smoothstep(uThresh, uThresh + 0.9, l);
  fragColor = vec4(c * k, 1.0);
}
`;

const BLUR_FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2 uDir;
void main() {
  vec2 uv = gl_FragCoord.xy / vec2(textureSize(uTex, 0));
  vec3 c = texture(uTex, uv).rgb * 0.2270270270;
  c += (texture(uTex, uv + uDir * 1.3846153846).rgb + texture(uTex, uv - uDir * 1.3846153846).rgb) * 0.3162162162;
  c += (texture(uTex, uv + uDir * 3.2307692308).rgb + texture(uTex, uv - uDir * 3.2307692308).rgb) * 0.0702702703;
  fragColor = vec4(c, 1.0);
}
`;

const POST_FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uResolution;
uniform sampler2D uHDR;
uniform sampler2D uBloom;
uniform float uExposure;
uniform float uBloomStrength;
uniform float uCA;
uniform float uVignette;
uniform float uGrain;
uniform float uTime;

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;
  vec2 dir = uv - 0.5;
  float r2 = dot(dir, dir);

  // 横向色散：R/B 沿径向反向偏移
  vec2 off = dir * uCA * r2;
  vec3 hdr;
  hdr.r = texture(uHDR, uv - off).r;
  hdr.g = texture(uHDR, uv).g;
  hdr.b = texture(uHDR, uv + off).b;
  vec3 bloom;
  bloom.r = texture(uBloom, uv - off).r;
  bloom.g = texture(uBloom, uv).g;
  bloom.b = texture(uBloom, uv + off).b;

  vec3 col = hdr + bloom * uBloomStrength;
  col *= uExposure;
  col = aces(col);
  col = pow(col, vec3(1.0 / 2.2));

  float vig = 1.0 - uVignette * r2;
  col *= clamp(vig, 0.0, 1.0);

  float grain = hash12(uv * uResolution + uTime) - 0.5;
  col += grain * uGrain;

  fragColor = vec4(col, 1.0);
}
`;

const sceneProg = createProgram(VS_SRC, SCENE_FS);
const brightProg = createProgram(VS_SRC, BRIGHT_FS);
const blurProg = createProgram(VS_SRC, BLUR_FS);
const postProg = createProgram(VS_SRC, POST_FS);

/* ============================================================
 * 相机（静态观者局部正交标架 + B 映射）
 * ============================================================ */
function oblateRJS(x, y, z, a) {
  const R2 = x * x + y * y + z * z;
  const a2 = a * a;
  const b = R2 - a2;
  const u = 0.5 * (b + Math.sqrt(Math.max(b * b + 4 * a2 * z * z, 0)));
  return Math.sqrt(Math.max(u, 0));
}

function cameraMetric(cam, a, Q) {
  const [x, y, z] = cam;
  const r = oblateRJS(x, y, z, a);
  const r2 = r * r;
  const a2 = a * a;
  const z2 = z * z;
  const D = Math.max(r2 + a2, 1e-10);
  const rSafe = Math.max(Math.abs(r), 1e-8);
  const r2Safe = Math.max(r2, 1e-12);
  const kx = (r * x + a * y) / D;
  const ky = (r * y - a * x) / D;
  const kz = z / rSafe;
  const sigma = r2 + a2 * z2 / r2Safe;
  const sig = Math.max(sigma, 1e-10);
  const f = (2 * r - Q * Q) / sig;
  return { r, sigma, f, kx, ky, kz };
}

const camState = {
  pos: [13, 0, 2.7],
  fwd: [0, 0, -1],
  right: [1, 0, 0],
  up: [0, 1, 0],
  B0: [1, 0, 0],
  B1: [0, 1, 0],
  B2: [0, 0, 1],
  k: [0, 0, 0],
  f: 0,
  sqrt1mf: 1,
};

function updateCamera() {
  const el = params.camElev * Math.PI / 180;
  const az = params.camAzim * Math.PI / 180;
  const D = params.camDist;
  const cam = [
    D * Math.cos(el) * Math.cos(az),
    D * Math.cos(el) * Math.sin(az),
    D * Math.sin(el),
  ];

  const a = -params.spin;      // outgoing 度规自旋
  const Q = params.charge;
  const m = cameraMetric(cam, a, Q);
  const oneMinusF = Math.max(1 - m.f, 0.04);
  const sqrt1mf = Math.sqrt(oneMinusF);
  const beta = sqrt1mf - 1;          // B = I + beta k k^T
  const betaInv = 1 / sqrt1mf - 1;   // B^{-1} = I + betaInv k k^T

  const k = [m.kx, m.ky, m.kz];
  const kdot = (v) => k[0] * v[0] + k[1] * v[1] + k[2] * v[2];
  const Bmul = (v, b) => {
    const kd = kdot(v);
    return [v[0] + b * k[0] * kd, v[1] + b * k[1] * kd, v[2] + b * k[2] * kd];
  };
  const norm = (v) => {
    const l = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  };
  const cross = (u, v) => [
    u[1] * v[2] - u[2] * v[1],
    u[2] * v[0] - u[0] * v[2],
    u[0] * v[1] - u[1] * v[0],
  ];

  const toTarget = norm([-cam[0], -cam[1], -cam[2]]);
  let fwd = norm(Bmul(toTarget, betaInv));
  let up0 = norm(Bmul([0, 0, 1], betaInv));
  let right = cross(fwd, up0);
  let rl = Math.hypot(right[0], right[1], right[2]);
  if (rl < 1e-6) {
    up0 = norm(Bmul([0, 1, 0], betaInv));
    right = cross(fwd, up0);
    rl = Math.hypot(right[0], right[1], right[2]);
  }
  right = [right[0] / rl, right[1] / rl, right[2] / rl];
  const up = cross(right, fwd);

  // B 的列
  const B0 = Bmul([1, 0, 0], beta);
  const B1 = Bmul([0, 1, 0], beta);
  const B2 = Bmul([0, 0, 1], beta);

  camState.pos = cam;
  camState.fwd = fwd;
  camState.right = right;
  camState.up = up;
  camState.B0 = B0; camState.B1 = B1; camState.B2 = B2;
  camState.k = k;
  camState.f = m.f;
  camState.sqrt1mf = sqrt1mf;
}

/* ============================================================
 * 渲染
 * ============================================================ */
function renderScene() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdrRT.fbo);
  gl.viewport(0, 0, hdrW, hdrH);
  gl.useProgram(sceneProg);

  const L = sceneLocs;
  gl.uniform2f(L.uResolution, hdrW, hdrH);
  gl.uniform1f(L.uTime, simTime);
  gl.uniform3fv(L.uCamPos, camState.pos);
  gl.uniform3fv(L.uCamF, camState.fwd);
  gl.uniform3fv(L.uCamR, camState.right);
  gl.uniform3fv(L.uCamU, camState.up);
  gl.uniform3fv(L.uCamB0, camState.B0);
  gl.uniform3fv(L.uCamB1, camState.B1);
  gl.uniform3fv(L.uCamB2, camState.B2);
  gl.uniform3fv(L.uCamK, camState.k);
  gl.uniform1f(L.uCamFval, camState.f);
  gl.uniform1f(L.uCamSqrt, camState.sqrt1mf);
  gl.uniform1f(L.uA, -params.spin);
  gl.uniform1f(L.uQ, params.charge);
  gl.uniform1f(L.uSpin, params.spin);
  gl.uniform1f(L.uDiskInner, params.diskInner);
  gl.uniform1f(L.uDiskOuter, params.diskOuter);
  gl.uniform1f(L.uDiskBright, params.diskBright);
  gl.uniform1f(L.uDiskDensity, params.diskDensity);
  gl.uniform1f(L.uDiskTemp, params.diskTemp);
  gl.uniform1f(L.uDiskHeight, params.diskHeight);
  gl.uniform1f(L.uTurbStr, params.turbStr);
  gl.uniform1f(L.uTurbScale, params.turbScale);
  gl.uniform1f(L.uTurbSpeed, params.turbSpeed);
  gl.uniform1f(L.uExtStr, params.extStr);
  gl.uniform1f(L.uSkyBright, params.skyBright);
  gl.uniform1f(L.uStepScale, params.stepScale);
  gl.uniform1f(L.uFovTan, Math.tan(params.fov * 0.5 * Math.PI / 180));
  gl.uniform1i(L.uMaxSteps, params.maxSteps | 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, skyTexture);
  gl.uniform1i(L.uSkyTex, 0);

  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
}

function renderPost() {
  const bw = brightRT.w, bh = brightRT.h;

  // 亮部提取
  gl.bindFramebuffer(gl.FRAMEBUFFER, brightRT.fbo);
  gl.viewport(0, 0, bw, bh);
  gl.useProgram(brightProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, hdrRT.tex);
  gl.uniform1i(brightLocs.uTex, 0);
  gl.uniform1f(brightLocs.uThresh, 0.9);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 水平模糊
  gl.bindFramebuffer(gl.FRAMEBUFFER, blurA.fbo);
  gl.viewport(0, 0, bw, bh);
  gl.useProgram(blurProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, brightRT.tex);
  gl.uniform1i(blurLocs.uTex, 0);
  gl.uniform2f(blurLocs.uDir, 1.0 / bw, 0.0);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 垂直模糊
  gl.bindFramebuffer(gl.FRAMEBUFFER, blurB.fbo);
  gl.viewport(0, 0, bw, bh);
  gl.useProgram(blurProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, blurA.tex);
  gl.uniform1i(blurLocs.uTex, 0);
  gl.uniform2f(blurLocs.uDir, 0.0, 1.0 / bh);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 合成 + 色调映射 + 色散 + 暗角 + 颗粒
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(postProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, hdrRT.tex);
  gl.uniform1i(postLocs.uHDR, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, blurB.tex);
  gl.uniform1i(postLocs.uBloom, 1);
  gl.uniform2f(postLocs.uResolution, canvas.width, canvas.height);
  gl.uniform1f(postLocs.uExposure, params.exposure);
  gl.uniform1f(postLocs.uBloomStrength, params.bloom);
  gl.uniform1f(postLocs.uCA, params.ca);
  gl.uniform1f(postLocs.uVignette, params.vignette);
  gl.uniform1f(postLocs.uGrain, 0.012);
  gl.uniform1f(postLocs.uTime, simTime);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
}

function render() {
  updateCamera();
  renderScene();
  renderPost();
}

/* ============================================================
 * 主循环
 * ============================================================ */
let simTime = 0;
let lastNow = performance.now();

function frame(now) {
  const dt = Math.min((now - lastNow) / 1000, 0.1);
  lastNow = now;
  if (!params.pause) {
    simTime += dt;
    if (params.autoOrbit) {
      params.camAzim += dt * 1.6;
      if (params.camAzim > 180) params.camAzim -= 360;
      if (params.camAzim < -180) params.camAzim += 360;
      const sl = document.getElementById('sl-camAzim');
      const vl = document.getElementById('val-camAzim');
      if (sl && !sl.matches(':active')) sl.value = params.camAzim;
      if (vl) vl.textContent = (+params.camAzim).toFixed(1);
    }
  }
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
 * UI
 * ============================================================ */
const uiConfig = [
  { section: '时空参数', id: 'spin', label: '自旋 a/M', min: -1.5, max: 1.5, step: 0.005, fmt: v => (+v).toFixed(2) },
  { section: '时空参数', id: 'charge', label: '电荷 Q/M', min: 0, max: 1.5, step: 0.005, fmt: v => (+v).toFixed(2) },

  { section: '相机', id: 'camDist', label: '距离 r/M', min: 4, max: 40, step: 0.1, fmt: v => (+v).toFixed(1) },
  { section: '相机', id: 'camElev', label: '仰角 /°', min: -85, max: 85, step: 0.5, fmt: v => (+v).toFixed(1) },
  { section: '相机', id: 'camAzim', label: '方位角 /°', min: -180, max: 180, step: 0.5, fmt: v => (+v).toFixed(1) },
  { section: '相机', id: 'fov', label: '视场角 /°', min: 30, max: 110, step: 0.5, fmt: v => (+v).toFixed(1) },

  { section: '吸积盘 · 结构', id: 'diskInner', label: '内半径', min: 1.2, max: 8, step: 0.05, fmt: v => (+v).toFixed(2) },
  { section: '吸积盘 · 结构', id: 'diskOuter', label: '密度标长', min: 2, max: 20, step: 0.1, fmt: v => (+v).toFixed(1) },
  { section: '吸积盘 · 结构', id: 'diskHeight', label: '盘半厚', min: 0.05, max: 2, step: 0.01, fmt: v => (+v).toFixed(2) },
  { section: '吸积盘 · 结构', id: 'diskDensity', label: '密度强度', min: 0, max: 6, step: 0.05, fmt: v => (+v).toFixed(2) },

  { section: '吸积盘 · 辐射', id: 'diskBright', label: '亮度强度', min: 0, max: 10, step: 0.05, fmt: v => (+v).toFixed(2) },
  { section: '吸积盘 · 辐射', id: 'diskTemp', label: '内缘温度 K', min: 1500, max: 20000, step: 100, fmt: v => Math.round(+v) },
  { section: '吸积盘 · 辐射', id: 'extStr', label: '消光强度', min: 0, max: 5, step: 0.05, fmt: v => (+v).toFixed(2) },

  { section: '湍流', id: 'turbStr', label: '湍流强度', min: 0, max: 2, step: 0.01, fmt: v => (+v).toFixed(2) },
  { section: '湍流', id: 'turbScale', label: '湍流尺度', min: 0.5, max: 10, step: 0.05, fmt: v => (+v).toFixed(2) },
  { section: '湍流', id: 'turbSpeed', label: '湍流转速', min: 0, max: 5, step: 0.05, fmt: v => (+v).toFixed(2) },

  { section: '后处理', id: 'exposure', label: '曝光', min: 0.1, max: 5, step: 0.02, fmt: v => (+v).toFixed(2) },
  { section: '后处理', id: 'bloom', label: '泛光强度', min: 0, max: 3, step: 0.01, fmt: v => (+v).toFixed(2) },
  { section: '后处理', id: 'ca', label: '色散', min: 0, max: 0.02, step: 0.0001, fmt: v => (+v).toFixed(4) },
  { section: '后处理', id: 'vignette', label: '暗角', min: 0, max: 1, step: 0.01, fmt: v => (+v).toFixed(2) },
  { section: '后处理', id: 'skyBright', label: '星空亮度', min: 0, max: 4, step: 0.05, fmt: v => (+v).toFixed(2) },

  { section: '积分质量', id: 'stepScale', label: '步长因子', min: 0.2, max: 3, step: 0.05, fmt: v => (+v).toFixed(2) },
  { section: '积分质量', id: 'maxSteps', label: '最大步数', min: 512, max: 4000, step: 64, fmt: v => Math.round(+v) },
  { section: '积分质量', id: 'renderScale', label: '渲染分辨率', min: 0.25, max: 1, step: 0.05, fmt: v => Math.round(+v * 100) + '%' },
];

function buildUI() {
  const body = document.getElementById('panel-body');
  let currentSection = null;
  for (const cfg of uiConfig) {
    if (!currentSection || currentSection.dataset.section !== cfg.section) {
      const sec = document.createElement('div');
      sec.className = 'section';
      sec.dataset.section = cfg.section;
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = cfg.section;
      sec.appendChild(title);
      body.appendChild(sec);
      currentSection = sec;
    }
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.textContent = cfg.label;
    const input = document.createElement('input');
    input.type = 'range';
    input.id = 'sl-' + cfg.id;
    input.min = cfg.min;
    input.max = cfg.max;
    input.step = cfg.step;
    input.value = params[cfg.id];
    const val = document.createElement('span');
    val.className = 'val';
    val.id = 'val-' + cfg.id;
    val.textContent = cfg.fmt(params[cfg.id]);
    input.addEventListener('input', () => {
      params[cfg.id] = parseFloat(input.value);
      val.textContent = cfg.fmt(input.value);
      if (cfg.id === 'renderScale') resize();
    });
    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(val);
    currentSection.appendChild(row);
  }

  const checkRow = document.createElement('div');
  checkRow.className = 'checkbox-row';
  const autoCb = document.createElement('input');
  autoCb.type = 'checkbox';
  autoCb.id = 'cb-auto';
  autoCb.checked = params.autoOrbit;
  autoCb.addEventListener('change', () => { params.autoOrbit = autoCb.checked; });
  const autoLabel = document.createElement('label');
  autoLabel.textContent = '自动环绕相机';
  autoLabel.htmlFor = 'cb-auto';
  checkRow.appendChild(autoCb);
  checkRow.appendChild(autoLabel);
  document.querySelector('#panel-body').appendChild(checkRow);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const pauseBtn = document.createElement('button');
  pauseBtn.className = 'btn warm';
  pauseBtn.textContent = '⏸ 暂停';
  pauseBtn.addEventListener('click', () => {
    params.pause = !params.pause;
    pauseBtn.textContent = params.pause ? '▶ 继续' : '⏸ 暂停';
  });
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn';
  resetBtn.textContent = '↺ 重置参数';
  resetBtn.addEventListener('click', () => {
    Object.assign(params, DEFAULTS);
    document.querySelectorAll('#panel-body input[type=range]').forEach(inp => {
      const id = inp.id.replace('sl-', '');
      if (id in params) {
        inp.value = params[id];
        const val = document.getElementById('val-' + id);
        const cfg = uiConfig.find(c => c.id === id);
        if (val && cfg) val.textContent = cfg.fmt(params[id]);
      }
    });
    autoCb.checked = params.autoOrbit;
    resize();
  });
  btnRow.appendChild(pauseBtn);
  btnRow.appendChild(resetBtn);
  document.querySelector('#panel-body').appendChild(btnRow);

  const info = document.createElement('div');
  info.id = 'info-bar';
  info.innerHTML = '提示：<b>a/M &gt; 1</b> 或 <b>Q/M &gt; 1</b> 可观察裸奇环/裸奇点；<br>裸奇环另一侧为 antiverse（反向星空）。<br>拖拽右侧参数实时调整，暗色区域为黑洞阴影。';
  document.querySelector('#panel-body').appendChild(info);
}

/* ============================================================
 * uniform 位置缓存
 * ============================================================ */
const sceneLocs = {};
const brightLocs = {};
const blurLocs = {};
const postLocs = {};

function cacheLocs(prog, obj, names) {
  for (const n of names) obj[n] = gl.getUniformLocation(prog, n);
}
{
  gl.useProgram(sceneProg);
  cacheLocs(sceneProg, sceneLocs, ['uResolution','uTime','uCamPos','uCamF','uCamR','uCamU','uCamB0','uCamB1','uCamB2','uCamK','uCamFval','uCamSqrt','uA','uQ','uSpin','uDiskInner','uDiskOuter','uDiskBright','uDiskDensity','uDiskTemp','uDiskHeight','uTurbStr','uTurbScale','uTurbSpeed','uExtStr','uSkyBright','uStepScale','uFovTan','uMaxSteps','uSkyTex']);
}
{
  gl.useProgram(brightProg);
  cacheLocs(brightProg, brightLocs, ['uTex','uThresh']);
}
{
  gl.useProgram(blurProg);
  cacheLocs(blurProg, blurLocs, ['uTex','uDir']);
}
{
  gl.useProgram(postProg);
  cacheLocs(postProg, postLocs, ['uResolution','uHDR','uBloom','uExposure','uBloomStrength','uCA','uVignette','uGrain','uTime']);
}

/* ============================================================
 * 启动
 * ============================================================ */
buildUI();
resize();
updateCamera();
render();
requestAnimationFrame(frame);
 
window.addEventListener('resize', () => { resize(); render(); });
</script>
